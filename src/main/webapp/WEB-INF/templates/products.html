<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${msg.t('products.title')}">products</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 960px; margin: 1rem auto; }
        .nav { display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; margin-bottom: 1rem; }
        .flash { color: #b00020; margin-bottom: 1rem; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: .4rem .5rem; vertical-align: top; }
        th { text-align: left; background: #f5f5f5; }
        .row-actions { white-space: nowrap; }
        form.inline { display: inline; }
    </style>
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<p class="flash" th:if="${flash != null}" th:text="${msg.t(flash)}"></p>
<h1 th:text="${msg.t('products.title')}">Products</h1>
<table>
    <thead>
    <tr>
        <th th:text="${msg.t('product.name')}">name</th>
        <th th:text="${msg.t('product.description')}">desc</th>
        <th th:text="${msg.t('price.cents')}">price</th>
        <th th:text="${msg.t('stock')}">st</th>
        <th th:if="${user != null}" th:text="${msg.t('actions')}">act</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="p : ${products}">
        <td th:text="${p.name}">n</td>
        <td th:text="${p.description}">d</td>
        <td th:text="${p.priceCents}">0</td>
        <td th:text="${p.stock}">0</td>
        <td th:if="${user != null}" class="row-actions">
            <form th:action="@{/app/orders/create}" method="post" class="inline">
                <input type="hidden" name="productId" th:value="${p.id}"/>
                <input name="quantity" type="number" min="1" max="999" value="1" required style="width:4rem"/>
                <button type="submit" th:text="${msg.t('order.place')}">buy</button>
            </form>
            <a th:href="@{/app/products/form(id=${p.id})}" th:text="${msg.t('product.edit')}">e</a>
            <form th:action="@{/app/products/delete}" method="post" class="inline" onsubmit="return confirm('OK?');">
                <input type="hidden" name="id" th:value="${p.id}"/>
                <button type="submit" th:text="${msg.t('product.delete')}">x</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
