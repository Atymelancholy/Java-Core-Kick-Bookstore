<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${msg.t('error.title')}">error</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 720px; margin: 1rem auto; padding: 0 1rem; }
        code { background: #f6f6f6; padding: .1rem .25rem; border-radius: 4px; }
    </style>
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<h1 th:text="${msg.t('error.title')}">Error</h1>
<p>
    <span th:text="${msg.t('error.code')}">HTTP</span>:
    <code th:text="${code}">500</code>
</p>
<p><a th:href="@{/app/products}" th:text="${msg.t('nav.catalog')}">Catalog</a></p>
</body>
</html>
