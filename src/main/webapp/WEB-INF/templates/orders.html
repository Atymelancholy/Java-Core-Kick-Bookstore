<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${msg.t('orders.title')}">orders</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 960px; margin: 1rem auto; padding: 0 1rem; }
        .flash { color: #b00020; }
        article { border: 1px solid #ddd; margin: 1rem 0; padding: .75rem 1rem; border-radius: 6px; }
        table { border-collapse: collapse; width: 100%; margin-top: .5rem; }
        th, td { border: 1px solid #eee; padding: .25rem .5rem; text-align: left; }
        .pager { margin-top: 1rem; }
    </style>
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<p class="flash" th:if="${flash != null}" th:text="${msg.t(flash)}"></p>
<p th:if="${#lists.isEmpty(orders)}" th:text="${msg.t('order.empty')}">empty</p>
<article th:each="o : ${orders}">
    <div>
        <strong>#<span th:text="${o.id}">0</span></strong>
        — <span th:text="${#temporals.format(o.createdAt, 'yyyy-MM-dd HH:mm')}">t</span>
        — <span th:text="${msg.orderStatus(o.status)}">s</span>
        — <span th:text="${msg.t('order.total')}">total</span>:
        <span th:text="${msg.priceByn(o.totalCents())}">0</span>
        <form th:if="${o.status == 'PLACED'}"
              th:action="@{/app/orders/cancel}"
              method="post"
              style="display:inline; margin-left:1rem">
            <input type="hidden" name="orderId" th:value="${o.id}"/>
            <button type="submit" th:text="${msg.t('order.cancel')}">cancel</button>
        </form>
    </div>
    <table>
        <tr th:each="l : ${o.lines}">
            <td th:text="${l.productName}">p</td>
            <td th:text="${l.quantity}">q</td>
            <td th:text="${l.unitPriceCents}">u</td>
        </tr>
    </table>
</article>
<div class="pager" th:if="${totalPages > 1}">
    <span th:text="${msg.t('order.page')}">Page</span>
    <a th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
       th:href="@{/app/orders(page=${i})}"
       th:text="${i + 1}"
       th:classappend="${i == page} ? ' current'">1</a>
</div>
</body>
</html>
