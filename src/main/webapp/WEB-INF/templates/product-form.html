<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${product == null ? msg.t('product.new') : msg.t('product.edit')}">form</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 720px;
            margin: 1rem auto;
            padding: 0 1rem;
        }
        .auth-form .field textarea {
            width: 100%;
            min-height: 6rem;
            padding: 0.45rem 0.5rem;
            font: inherit;
            border: 1px solid #aaa;
            border-radius: 4px;
            box-sizing: border-box;
            resize: vertical;
            text-align: left;
        }
    </style>
    <div th:replace="~{fragments :: authFormStyles}"></div>
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>

<div class="auth-page">
    <form class="auth-form" th:action="@{/app/products/form}" method="post">
        <input type="hidden" name="id" th:if="${product != null}" th:value="${product.id}"/>
        <div class="field">
            <label th:text="${msg.t('product.name')}">n</label>
            <input name="name" required maxlength="255" th:value="${product != null ? product.name : ''}"/>
        </div>
        <div class="field">
            <label th:text="${msg.t('product.description')}">d</label>
            <textarea name="description" rows="6" maxlength="2000"
                      th:text="${product != null ? product.description : ''}"></textarea>
        </div>
        <div class="field">
            <label th:text="${msg.t('price.byn')}">p</label>
            <input name="priceByn" type="number" min="0.01" step="0.01" max="100000" required
                   th:value="${product != null ? (product.priceCents / 100.0) : ''}"/>
        </div>
        <div class="field">
            <label th:text="${msg.t('stock')}">s</label>
            <input name="stock" type="number" min="0" max="1000000" required
                   th:value="${product != null ? product.stock : ''}"/>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn" th:text="${msg.t('btn.product.save')}">save</button>
        </div>
    </form>
</div>
</body>
</html>
